piv_slot = "9c"
pin_cache = "session" # or "never": consume the cached PIN on each mint
notify_cmd = ["notify-send", "pivb"] # [] disables desktop notifications
# Optional. systemd --user does not read shell startup files, so set this when
# the contending scdaemon uses a non-default GnuPG home. Existence and access
# are checked lazily only when recovery needs GnuPG.
gnupg_home = "/home/replace-me/.gnupg"

[wif]
# Numeric project number of the project hosting the workload identity pool,
# not the project ID.
project_number = "123456789012"
pool_id = "pivb"
provider_id = "yubikey-piv"
# Durable HTTPS trust-domain identifier. No metadata endpoint is hosted there,
# but the value must be unique to this deployment and never a Google issuer.
issuer_uri = "https://auth.example.net/pivb/replace-with-deployment-id"

# One table per enrolled YubiKey. jwk_kid is the unpadded base64url SHA-256 of
# the slot-9c public key's DER SubjectPublicKeyInfo; `pivb wif jwks` derives it
# and names the expected value when it does not match.
[keys.12345678]
jwk_kid = "replace-with-43-char-base64url-spki-digest0"

[keys.23456789]
jwk_kid = "replace-with-43-char-base64url-spki-digest1"

# One alias per target service account. Each alias gets its own credential
# file, provider-condition pair, and per-target Workload Identity User binding.
#
# assertion_reuse_s is consent, not a cache setting. At 0, the default, every
# credential this alias issues costs one physical touch. Above 0, one touch
# authorises this alias touch-free for up to that many further seconds — but
# only for the byte-identical requester tuple: same alias, target, audience,
# agent session, attachment policy, claimed card, and workspace claim
# generation. Anything else still asks for a touch, the touch prompt states
# what it is granting, and the window is announced 60 seconds before it closes.
# The bound is assertion_lifetime_s minus 90: 30 seconds of an assertion are
# already spent on iat backdating when it is signed, and a served assertion
# must keep at least 60 seconds of validity. At the default 300s lifetime that
# is 210 seconds; at 900 it is 810.
#
# assertion_lifetime_s is how long one minted assertion stays exchangeable for
# Google access tokens, 300..min(3600, lifetime_s), default 300. Raising it is
# the other half of the same consent: one touch's assertion keeps buying access
# tokens for that much longer, so the horizon a single touch opens is
# assertion_lifetime_s + lifetime_s — the assertion stays exchangeable for the
# first, and the last access token it buys lives for the second after that. The
# ceiling is tightened to this alias's own lifetime_s so the assertion never
# outlives the credential it exists to buy, and a non-default value is named on
# the touch prompt.
#
# Requests that arrive while an identical one is already being signed are
# always answered from that signature, at every setting. They were queued
# behind that touch, so they are part of what it authorised.
[aliases.ro]
cloud = "gcp" # optional; gcp is the only supported value
target = "readonly-sa@example-project-id.iam.gserviceaccount.com"
lifetime_s = 3600 # target access-token lifetime, 600..3600
assertion_lifetime_s = 300 # assertion validity, 300..min(3600, lifetime_s)
assertion_reuse_s = 0 # touch-free seconds after a touch, 0..210 (0 = every credential is touched)

[aliases.deploy]
target = "deployment-sa@example-project-id.iam.gserviceaccount.com"
lifetime_s = 3600
